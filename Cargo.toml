[package]
name = "rathia"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
kira = { version = "0.12", features = ["mp3", "ogg", "wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
byteorder = "1"
walkdir = "2"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
